name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.44.4'

jobs:
  analyze-test:
    name: Análisis y tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test
      - name: Reglas de negocio (voxon_domain)
        working-directory: packages/voxon_domain
        run: |
          dart pub get
          dart format --output=none --set-exit-if-changed .
          dart analyze
          dart test

  android:
    name: Android (APK)
    needs: analyze-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter build apk --release --dart-define-from-file=config/prod.json
      - uses: actions/upload-artifact@v4
        with:
          name: voxon90-android
          path: build/app/outputs/flutter-apk/app-release.apk

  linux:
    name: Linux (.deb)
    needs: analyze-test
    # Ubuntu 22.04 (glibc 2.35) para que el binario funcione en Debian 12 o superior.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Dependencias de compilación
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter build linux --release --dart-define-from-file=config/prod.json
      - run: scripts/build_deb.sh
      - uses: actions/upload-artifact@v4
        with:
          name: voxon90-linux-deb
          path: build/deb/*.deb

  windows:
    name: Windows
    needs: analyze-test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter build windows --release --dart-define-from-file=config/prod.json
      - uses: actions/upload-artifact@v4
        with:
          name: voxon90-windows
          path: build/windows/x64/runner/Release

  macos:
    name: macOS
    needs: analyze-test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter build macos --release --dart-define-from-file=config/prod.json
      # Se comprime con ditto para conservar symlinks y permisos del .app.
      - run: ditto -c -k --keepParent build/macos/Build/Products/Release/VOXON90.app voxon90-macos.zip
      - uses: actions/upload-artifact@v4
        with:
          name: voxon90-macos
          path: voxon90-macos.zip

  app-dueno:
    name: App del dueño
    needs: analyze-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Análisis y tests
        working-directory: apps/voxon90_owner
        run: |
          flutter pub get
          dart format --output=none --set-exit-if-changed lib test
          flutter analyze
          flutter test

  nube:
    name: Nube opcional (reglas y sincronización)
    needs: analyze-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          # Los emuladores de Firebase exigen JDK 21; el servidor igual compila para Java 17.
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Dependencias de las pruebas
        working-directory: firebase
        run: npm install --no-audit --no-fund
      - name: Reglas de Firestore
        working-directory: firebase
        run: npm test
      - name: Sincronización contra los emuladores
        working-directory: firebase
        run: npm run test:sync

  backend:
    name: Backend local (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Herramientas de compilación (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build sqlite3
      - name: SQL, C++, Java y JS (Linux y macOS)
        if: runner.os != 'Windows'
        run: scripts/build-backend.sh
      - name: SQL, C++, Java y JS (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: scripts/build-backend.ps1
