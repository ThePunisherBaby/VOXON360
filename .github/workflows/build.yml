name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.44.4'

jobs:
  dominio:
    name: Reglas de negocio (voxon_domain)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/voxon_domain
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: dart pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: dart analyze
      # Incluye la prueba que avisa si los modos y planes se desincronizan de shared/.
      - run: dart test

  flutter:
    name: ${{ matrix.package }}
    strategy:
      fail-fast: false
      matrix:
        package:
          - packages/voxon_data
          - packages/voxon_ui
          - apps/voxon_pos
          - apps/voxon360
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test

  firebase:
    name: Firebase (reglas, funciones y flujo)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firebase
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          # Los emuladores de Firebase exigen JDK 21.
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Dependencias
        run: |
          npm install --no-audit --no-fund
          npm install --prefix functions --no-audit --no-fund
      # Valores de mentira: las claves reales de Stripe viven solo en Firebase.
      - name: Secretos para el emulador
        run: printf 'STRIPE_SECRET_KEY=no-configurado\nSTRIPE_WEBHOOK_SECRET=no-configurado\n' > functions/.secret.local
      - name: Reglas de Firestore
        run: npm test
      - name: Funciones y flujo completo contra los emuladores
        run: npm run test:functions
