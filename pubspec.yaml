name: voxon90
description: "VOXON90 - aplicación multiplataforma (Android, Linux, macOS, Windows)."
publish_to: 'none'

# versión+build. Android: versionName+versionCode. Windows/macOS: versión de producto.
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.4.3    # estado e inyección de dependencias
  go_router: ^18.0.1          # navegación declarativa
  intl: any                   # traducciones, fechas y números (versión fijada por el SDK)
  shared_preferences: ^2.5.5  # ajustes del equipo: caja principal, tema e idioma
  voxon_domain:               # dinero y cantidades con las mismas reglas del motor C++
    path: packages/voxon_domain

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true  # genera AppLocalizations a partir de lib/l10n/*.arb
